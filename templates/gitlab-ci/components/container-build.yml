spec:
  inputs:
    stage:
      default: build
    image_name:
      default: $CI_REGISTRY_IMAGE
    dockerfile:
      default: Dockerfile
    context:
      default: .
    platforms:
      default: linux/amd64
---
container-build:
  stage: $[[ inputs.stage ]]

  image:
    name: docker:29.1.3-cli

  services:
    - name: docker:29.1.3-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_CERT_PATH: /certs/client
    DOCKER_TLS_VERIFY: "1"
    BUILDX_NO_DEFAULT_ATTESTATIONS: "0"

  before_script:
    - set -eu
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker buildx create --driver docker-container --use --name platform-builder
    - docker buildx inspect --bootstrap

  script:
    - set -eu
    - export IMMUTABLE_TAG="sha-${CI_COMMIT_SHA}"
    - export IMAGE="$[[ inputs.image_name ]]:${IMMUTABLE_TAG}"
    - |
      docker buildx build \
        --file "$[[ inputs.dockerfile ]]" \
        --platform "$[[ inputs.platforms ]]" \
        --provenance=mode=max \
        --sbom=true \
        --cache-from "type=registry,ref=$[[ inputs.image_name ]]:buildcache" \
        --cache-to "type=registry,ref=$[[ inputs.image_name ]]:buildcache,mode=max" \
        --tag "${IMAGE}" \
        --push \
        "$[[ inputs.context ]]"
    - docker buildx imagetools inspect "${IMAGE}"
    - printf 'IMAGE=%s\n' "${IMAGE}" > build.env

  artifacts:
    reports:
      dotenv: build.env
    expire_in: 7 days

  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

  interruptible: true
