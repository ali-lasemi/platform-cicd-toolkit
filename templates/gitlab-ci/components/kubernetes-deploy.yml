spec:
  inputs:
    stage:
      default: deploy
    environment:
      default: staging
    namespace:
      default: staging
    deployment:
      default: application
    container:
      default: application
    rollout_timeout:
      default: 300s
---
kubernetes-deploy:
  stage: $[[ inputs.stage ]]

  image:
    name: bitnami/kubectl:1.34.1
    entrypoint:
      - ""

  environment:
    name: $[[ inputs.environment ]]

  resource_group: $[[ inputs.environment ]]

  before_script:
    - set -eu
    - test -n "${KUBECONFIG_B64:-}"
    - mkdir -p "$HOME/.kube"
    - printf '%s' "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
    - chmod 600 "$HOME/.kube/config"

  script:
    - set -eu
    - test -n "${IMAGE:-}"
    - kubectl auth can-i get deployments --namespace "$[[ inputs.namespace ]]" | grep -qx yes
    - kubectl auth can-i patch deployments --namespace "$[[ inputs.namespace ]]" | grep -qx yes
    - |
      PREVIOUS_IMAGE="$(
        kubectl get deployment "$[[ inputs.deployment ]]" \
          --namespace "$[[ inputs.namespace ]]" \
          -o jsonpath="{.spec.template.spec.containers[?(@.name=='$[[ inputs.container ]]')].image}"
      )"
      printf 'PREVIOUS_IMAGE=%s\n' "$PREVIOUS_IMAGE" > rollback.env
    - |
      kubectl set image \
        deployment/"$[[ inputs.deployment ]]" \
        "$[[ inputs.container ]]=${IMAGE}" \
        --namespace "$[[ inputs.namespace ]]"
    - |
      kubectl rollout status \
        deployment/"$[[ inputs.deployment ]]" \
        --namespace "$[[ inputs.namespace ]]" \
        --timeout "$[[ inputs.rollout_timeout ]]"
    - |
      DEPLOYED_IMAGE="$(
        kubectl get deployment "$[[ inputs.deployment ]]" \
          --namespace "$[[ inputs.namespace ]]" \
          -o jsonpath="{.spec.template.spec.containers[?(@.name=='$[[ inputs.container ]]')].image}"
      )"

      test "$DEPLOYED_IMAGE" = "$IMAGE"

  artifacts:
    when: always
    reports:
      dotenv: rollback.env
    expire_in: 7 days

  needs:
    - job: container-build
      artifacts: true
    - job: container-security
      artifacts: false

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false
