replicaCount: 3

image:
  repository: ghcr.io/example/platform-app
  tag: sha-placeholder
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  readiness:
    path: /health/ready
    initialDelaySeconds: 5
    periodSeconds: 5
  liveness:
    path: /health/live
    initialDelaySeconds: 15
    periodSeconds: 10

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
