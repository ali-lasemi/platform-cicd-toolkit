apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: platform-app
spec:
  replicas: 5
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: platform-app

  template:
    metadata:
      labels:
        app: platform-app
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: application
          image: ghcr.io/example/platform-app@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

          ports:
            - name: http
              containerPort: 8080

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10

  strategy:
    canary:
      stableService: platform-app-stable
      canaryService: platform-app-canary

      maxUnavailable: 0
      maxSurge: 1

      steps:
        - setWeight: 10

        - pause:
            duration: 2m

        - setWeight: 25

        - pause:
            duration: 3m

        - setWeight: 50

        - pause:
            duration: 5m

        - setWeight: 75

        - pause:
            duration: 5m

        - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: platform-app-stable
spec:
  selector:
    app: platform-app

  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: platform-app-canary
spec:
  selector:
    app: platform-app

  ports:
    - name: http
      port: 80
      targetPort: http
