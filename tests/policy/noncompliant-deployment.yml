apiVersion: apps/v1
kind: Deployment
metadata:
  name: noncompliant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: noncompliant
  template:
    metadata:
      labels:
        app: noncompliant
    spec:
      containers:
        - name: application
          image: ghcr.io/example/application:latest
