name: Reusable Supply Chain Security

on:
  workflow_call:
    inputs:
      image:
        description: Fully qualified immutable image reference including digest
        required: true
        type: string

      sbom_path:
        description: Optional SPDX JSON SBOM path
        required: false
        type: string
        default: ""

      sign:
        description: Sign image using GitHub OIDC keyless signing
        required: false
        type: boolean
        default: true

      attest_provenance:
        description: Create GitHub build provenance attestation
        required: false
        type: boolean
        default: true

      attest_sbom:
        description: Attach SBOM attestation when sbom_path is provided
        required: false
        type: boolean
        default: true

    outputs:
      verified:
        description: Signature verification result
        value: ${{ jobs.supply_chain.outputs.verified }}

permissions:
  contents: read
  id-token: write
  packages: write
  attestations: write

jobs:
  supply_chain:
    name: Supply chain security
    runs-on: ubuntu-latest

    outputs:
      verified: ${{ steps.verify.outputs.verified }}

    steps:
      - name: Checkout repository
        if: inputs.sbom_path != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Validate immutable image reference
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -Eeuo pipefail

          if [[ ! "$IMAGE" =~ @sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Supply-chain operations require an immutable sha256 image reference"
            exit 1
          fi

      - name: Install Cosign
        uses: sigstore/cosign-installer@{"message":"No commit found for SHA: v4","documentation_url":"https://docs.github.com/rest/commits/commits#get-a-commit","status":"422"}

      - name: Verify Cosign installation
        shell: bash
        run: |
          set -Eeuo pipefail
          cosign version

      - name: Keyless sign image
        if: inputs.sign
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -Eeuo pipefail

          cosign sign \
            --yes \
            "$IMAGE"

      - name: Verify keyless signature
        id: verify
        if: inputs.sign
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail

          cosign verify \
            --certificate-identity-regexp "^https://github.com/${REPOSITORY}/.github/workflows/.*@refs/heads/.*$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE"

          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Validate SBOM
        if: inputs.attest_sbom && inputs.sbom_path != ''
        shell: bash
        env:
          SBOM_PATH: ${{ inputs.sbom_path }}
        run: |
          set -Eeuo pipefail

          if [[ ! -f "$SBOM_PATH" ]]; then
            echo "::error::SBOM file not found: $SBOM_PATH"
            exit 1
          fi

          jq empty "$SBOM_PATH"

      - name: Attach SBOM attestation
        if: inputs.attest_sbom && inputs.sbom_path != ''
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
          SBOM_PATH: ${{ inputs.sbom_path }}
        run: |
          set -Eeuo pipefail

          cosign attest \
            --yes \
            --type spdxjson \
            --predicate "$SBOM_PATH" \
            "$IMAGE"

      - name: Generate provenance predicate
        if: inputs.attest_provenance
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -Eeuo pipefail

          mkdir -p supply-chain

          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg image "$IMAGE" \
            '{
              buildType: "https://github.com/Attestations/GitHubActionsWorkflow@v1",
              builder: {
                id: ("https://github.com/" + $repository + "/actions/runs/" + $run_id)
              },
              invocation: {
                configSource: {
                  uri: ("git+https://github.com/" + $repository),
                  digest: {
                    sha1: $commit
                  }
                }
              },
              metadata: {
                workflow: $workflow
              },
              subject: {
                image: $image
              }
            }' > supply-chain/provenance.json

      - name: Attach provenance attestation
        if: inputs.attest_provenance
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -Eeuo pipefail

          cosign attest \
            --yes \
            --type slsaprovenance \
            --predicate supply-chain/provenance.json \
            "$IMAGE"

      - name: Verify provenance attestation
        if: inputs.attest_provenance
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail

          cosign verify-attestation \
            --type slsaprovenance \
            --certificate-identity-regexp "^https://github.com/${REPOSITORY}/.github/workflows/.*@refs/heads/.*$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE"

      - name: Write supply-chain summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          {
            echo "## Supply Chain Security"
            echo
            echo "- Image: \`${{ inputs.image }}\`"
            echo "- Keyless signing: \`${{ inputs.sign }}\`"
            echo "- Provenance attestation: \`${{ inputs.attest_provenance }}\`"
            echo "- SBOM attestation: \`${{ inputs.attest_sbom && inputs.sbom_path != '' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

