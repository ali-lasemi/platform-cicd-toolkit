name: Reusable Environment Promotion

on:
  workflow_call:
    inputs:
      source_environment:
        description: Source environment
        required: true
        type: string

      target_environment:
        description: Target environment
        required: true
        type: string

      image:
        description: Immutable image reference including digest
        required: true
        type: string

      namespace:
        description: Target Kubernetes namespace
        required: true
        type: string

      deployment:
        description: Kubernetes deployment name
        required: true
        type: string

      container:
        description: Kubernetes container name
        required: true
        type: string

      rollout_timeout:
        description: Rollout timeout
        required: false
        type: string
        default: 300s

    secrets:
      kubeconfig:
        required: true

permissions:
  contents: read

concurrency:
  group: promotion-${{ inputs.target_environment }}-${{ inputs.namespace }}-${{ inputs.deployment }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate promotion
    runs-on: ubuntu-latest

    outputs:
      source_rank: ${{ steps.validate.outputs.source_rank }}
      target_rank: ${{ steps.validate.outputs.target_rank }}

    steps:
      - name: Validate immutable image digest
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -Eeuo pipefail

          if [[ ! "$IMAGE" =~ @sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Promotion requires an immutable image digest"
            exit 1
          fi

      - name: Validate environment transition
        id: validate
        shell: bash
        env:
          SOURCE: ${{ inputs.source_environment }}
          TARGET: ${{ inputs.target_environment }}
        run: |
          set -Eeuo pipefail

          rank() {
            case "$1" in
              development) echo 1 ;;
              staging) echo 2 ;;
              production) echo 3 ;;
              *)
                echo "::error::Unsupported environment: $1" >&2
                exit 1
                ;;
            esac
          }

          SOURCE_RANK="$(rank "$SOURCE")"
          TARGET_RANK="$(rank "$TARGET")"

          if (( TARGET_RANK != SOURCE_RANK + 1 )); then
            echo "::error::Only sequential promotion is allowed"
            exit 1
          fi

          echo "source_rank=${SOURCE_RANK}" >> "$GITHUB_OUTPUT"
          echo "target_rank=${TARGET_RANK}" >> "$GITHUB_OUTPUT"

  promote:
    name: Promote immutable artifact
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}

    steps:
      - name: Configure kubeconfig
        shell: bash
        env:
          KUBECONFIG_B64: ${{ secrets.kubeconfig }}
        run: |
          set -Eeuo pipefail

          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Verify Kubernetes permissions
        shell: bash
        run: |
          set -Eeuo pipefail

          kubectl auth can-i get deployments \
            --namespace "${{ inputs.namespace }}" |
          grep -qx yes

          kubectl auth can-i patch deployments \
            --namespace "${{ inputs.namespace }}" |
          grep -qx yes

      - name: Capture current image
        id: previous
        shell: bash
        run: |
          set -Eeuo pipefail

          CURRENT_IMAGE="$(
            kubectl get deployment "${{ inputs.deployment }}" \
              --namespace "${{ inputs.namespace }}" \
              -o jsonpath="{.spec.template.spec.containers[?(@.name=='${{ inputs.container }}')].image}"
          )"

          if [[ -z "$CURRENT_IMAGE" ]]; then
            echo "::error::Unable to determine current deployed image"
            exit 1
          fi

          echo "image=${CURRENT_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Promote image
        shell: bash
        run: |
          set -Eeuo pipefail

          kubectl set image \
            deployment/"${{ inputs.deployment }}" \
            "${{ inputs.container }}=${{ inputs.image }}" \
            --namespace "${{ inputs.namespace }}"

      - name: Wait for rollout
        shell: bash
        run: |
          set -Eeuo pipefail

          kubectl rollout status \
            deployment/"${{ inputs.deployment }}" \
            --namespace "${{ inputs.namespace }}" \
            --timeout "${{ inputs.rollout_timeout }}"

      - name: Verify promoted digest
        shell: bash
        env:
          EXPECTED_IMAGE: ${{ inputs.image }}
        run: |
          set -Eeuo pipefail

          DEPLOYED_IMAGE="$(
            kubectl get deployment "${{ inputs.deployment }}" \
              --namespace "${{ inputs.namespace }}" \
              -o jsonpath="{.spec.template.spec.containers[?(@.name=='${{ inputs.container }}')].image}"
          )"

          if [[ "$DEPLOYED_IMAGE" != "$EXPECTED_IMAGE" ]]; then
            echo "::error::Promotion verification failed"
            echo "Expected: $EXPECTED_IMAGE"
            echo "Actual:   $DEPLOYED_IMAGE"
            exit 1
          fi

      - name: Verify deployment availability
        shell: bash
        run: |
          set -Eeuo pipefail

          DESIRED="$(
            kubectl get deployment "${{ inputs.deployment }}" \
              --namespace "${{ inputs.namespace }}" \
              -o jsonpath='{.spec.replicas}'
          )"

          AVAILABLE="$(
            kubectl get deployment "${{ inputs.deployment }}" \
              --namespace "${{ inputs.namespace }}" \
              -o jsonpath='{.status.availableReplicas}'
          )"

          AVAILABLE="${AVAILABLE:-0}"

          if [[ "$AVAILABLE" -ne "$DESIRED" ]]; then
            echo "::error::Deployment availability check failed (${AVAILABLE}/${DESIRED})"
            exit 1
          fi

      - name: Write promotion summary
        shell: bash
        run: |
          set -Eeuo pipefail

          {
            echo "## Environment Promotion"
            echo
            echo "- Source: \`${{ inputs.source_environment }}\`"
            echo "- Target: \`${{ inputs.target_environment }}\`"
            echo "- Image: \`${{ inputs.image }}\`"
            echo "- Namespace: \`${{ inputs.namespace }}\`"
            echo "- Deployment: \`${{ inputs.deployment }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back failed promotion
        if: failure() && steps.previous.outputs.image != ''
        shell: bash
        run: |
          set +e

          kubectl set image \
            deployment/"${{ inputs.deployment }}" \
            "${{ inputs.container }}=${{ steps.previous.outputs.image }}" \
            --namespace "${{ inputs.namespace }}"

          kubectl rollout status \
            deployment/"${{ inputs.deployment }}" \
            --namespace "${{ inputs.namespace }}" \
            --timeout "${{ inputs.rollout_timeout }}"
