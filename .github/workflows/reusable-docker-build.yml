name: Reusable Docker Build

on:
  workflow_call:
    inputs:
      registry:
        description: Container registry hostname
        required: false
        type: string
        default: ghcr.io

      registry_username:
        description: Registry username
        required: false
        type: string
        default: ""

      image_name:
        description: Container image name without registry
        required: true
        type: string

      context:
        description: Docker build context
        required: false
        type: string
        default: .

      dockerfile:
        description: Dockerfile path
        required: false
        type: string
        default: ./Dockerfile

      platforms:
        description: Comma-separated target platforms
        required: false
        type: string
        default: linux/amd64

      push:
        description: Push image to registry
        required: false
        type: boolean
        default: false

    secrets:
      registry_password:
        required: false

    outputs:
      image:
        description: Fully qualified image name
        value: ${{ jobs.build.outputs.image }}

      digest:
        description: Published image digest
        value: ${{ jobs.build.outputs.digest }}

      immutable_tag:
        description: Immutable SHA image tag
        value: ${{ jobs.build.outputs.immutable_tag }}

permissions:
  contents: read

jobs:
  build:
    name: Build container image
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.outputs.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      immutable_tag: ${{ steps.outputs.outputs.immutable_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up QEMU
        if: contains(inputs.platforms, ',')
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Authenticate to registry
        if: inputs.push
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry_username != '' && inputs.registry_username || github.actor }}
          password: ${{ secrets.registry_password }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ inputs.registry }}/${{ inputs.image_name }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=tag

      - name: Build container image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Export workflow outputs
        id: outputs
        shell: bash
        env:
          IMAGE: ${{ inputs.registry }}/${{ inputs.image_name }}
        run: |
          set -Eeuo pipefail

          IMMUTABLE_TAG="${IMAGE}:sha-${GITHUB_SHA}"

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "immutable_tag=${IMMUTABLE_TAG}" >> "$GITHUB_OUTPUT"

          echo "Image: ${IMAGE}"
          echo "Immutable tag: ${IMMUTABLE_TAG}"


