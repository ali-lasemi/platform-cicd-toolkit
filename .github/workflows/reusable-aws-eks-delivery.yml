name: Reusable AWS EKS Delivery

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment name
        required: true
        type: string

      aws_region:
        description: AWS region
        required: true
        type: string

      role_arn:
        description: AWS IAM role assumed through GitHub OIDC
        required: true
        type: string

      cluster_name:
        description: EKS cluster name
        required: true
        type: string

      namespace:
        description: Kubernetes namespace
        required: true
        type: string

      deployment:
        description: Kubernetes deployment name
        required: true
        type: string

      container:
        description: Container name
        required: true
        type: string

      image:
        description: Immutable image reference including sha256 digest
        required: true
        type: string

      rollout_timeout:
        description: Kubernetes rollout timeout
        required: false
        type: string
        default: 300s

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-eks-${{ inputs.environment }}-${{ inputs.cluster_name }}-${{ inputs.namespace }}-${{ inputs.deployment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: AWS EKS delivery
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Validate immutable image
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -Eeuo pipefail

          if [[ ! "$IMAGE" =~ @sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::EKS delivery requires an immutable sha256 image reference"
            exit 1
          fi

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: platform-cicd-toolkit-${{ github.run_id }}

      - name: Verify AWS identity
        shell: bash
        run: |
          set -Eeuo pipefail
          aws sts get-caller-identity

      - name: Configure EKS access
        shell: bash
        run: |
          set -Eeuo pipefail

          aws eks update-kubeconfig \
            --region "${{ inputs.aws_region }}" \
            --name "${{ inputs.cluster_name }}"

          kubectl cluster-info

      - name: Verify Kubernetes authorization
        shell: bash
        run: |
          set -Eeuo pipefail

          kubectl auth can-i get deployments \
            --namespace "${{ inputs.namespace }}" |
          grep -qx yes

          kubectl auth can-i patch deployments \
            --namespace "${{ inputs.namespace }}" |
          grep -qx yes

      - name: Capture current image
        id: previous
        shell: bash
        run: |
          set -Eeuo pipefail

          PREVIOUS_IMAGE="$(
            kubectl get deployment "${{ inputs.deployment }}" \
              --namespace "${{ inputs.namespace }}" \
              -o jsonpath="{.spec.template.spec.containers[?(@.name=='${{ inputs.container }}')].image}"
          )"

          if [[ -z "$PREVIOUS_IMAGE" ]]; then
            echo "::error::Unable to resolve currently deployed image"
            exit 1
          fi

          echo "image=${PREVIOUS_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Deploy immutable image
        shell: bash
        run: |
          set -Eeuo pipefail

          kubectl set image \
            deployment/"${{ inputs.deployment }}" \
            "${{ inputs.container }}=${{ inputs.image }}" \
            --namespace "${{ inputs.namespace }}"

      - name: Wait for rollout
        shell: bash
        run: |
          set -Eeuo pipefail

          kubectl rollout status \
            deployment/"${{ inputs.deployment }}" \
            --namespace "${{ inputs.namespace }}" \
            --timeout "${{ inputs.rollout_timeout }}"

      - name: Verify deployment state
        shell: bash
        env:
          EXPECTED_IMAGE: ${{ inputs.image }}
        run: |
          set -Eeuo pipefail

          DESIRED="$(
            kubectl get deployment "${{ inputs.deployment }}" \
              --namespace "${{ inputs.namespace }}" \
              -o jsonpath='{.spec.replicas}'
          )"

          AVAILABLE="$(
            kubectl get deployment "${{ inputs.deployment }}" \
              --namespace "${{ inputs.namespace }}" \
              -o jsonpath='{.status.availableReplicas}'
          )"

          UPDATED="$(
            kubectl get deployment "${{ inputs.deployment }}" \
              --namespace "${{ inputs.namespace }}" \
              -o jsonpath='{.status.updatedReplicas}'
          )"

          DEPLOYED_IMAGE="$(
            kubectl get deployment "${{ inputs.deployment }}" \
              --namespace "${{ inputs.namespace }}" \
              -o jsonpath="{.spec.template.spec.containers[?(@.name=='${{ inputs.container }}')].image}"
          )"

          AVAILABLE="${AVAILABLE:-0}"
          UPDATED="${UPDATED:-0}"

          test "$AVAILABLE" = "$DESIRED"
          test "$UPDATED" = "$DESIRED"
          test "$DEPLOYED_IMAGE" = "$EXPECTED_IMAGE"

      - name: Roll back failed deployment
        if: failure() && steps.previous.outputs.image != ''
        shell: bash
        run: |
          set +e

          kubectl set image \
            deployment/"${{ inputs.deployment }}" \
            "${{ inputs.container }}=${{ steps.previous.outputs.image }}" \
            --namespace "${{ inputs.namespace }}"

          kubectl rollout status \
            deployment/"${{ inputs.deployment }}" \
            --namespace "${{ inputs.namespace }}" \
            --timeout "${{ inputs.rollout_timeout }}"

      - name: Write deployment summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          {
            echo "## AWS EKS Delivery"
            echo
            echo "- Environment: \`${{ inputs.environment }}\`"
            echo "- Region: \`${{ inputs.aws_region }}\`"
            echo "- Cluster: \`${{ inputs.cluster_name }}\`"
            echo "- Namespace: \`${{ inputs.namespace }}\`"
            echo "- Deployment: \`${{ inputs.deployment }}\`"
            echo "- Image: \`${{ inputs.image }}\`"
            echo "- Authentication: \`GitHub OIDC\`"
          } >> "$GITHUB_STEP_SUMMARY"
