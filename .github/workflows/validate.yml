name: Validate Repository

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Repository integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Check required files
        shell: bash
        run: |
          set -Eeuo pipefail

          required_files=(
            "README.md"
            "ROADMAP.md"
            "CHANGELOG.md"
            "LICENSE"
            "SECURITY.md"
            "CONTRIBUTING.md"
            "docs/architecture.md"
            ".github/dependabot.yml"
            ".github/CODEOWNERS"
            ".github/pull_request_template.md"
            ".github/ISSUE_TEMPLATE/bug.yml"
            ".github/ISSUE_TEMPLATE/feature.yml"
            ".github/ISSUE_TEMPLATE/config.yml"

            ".github/workflows/reusable-docker-build.yml"
            ".github/workflows/reusable-aws-eks-delivery.yml"
            ".github/workflows/reusable-container-security.yml"
            ".github/workflows/reusable-kubernetes-canary.yml"
            ".github/workflows/reusable-kubernetes-blue-green.yml"
            ".github/workflows/reusable-kubernetes-deploy.yml"
            ".github/workflows/reusable-helm-release.yml"
            ".github/workflows/reusable-environment-promotion.yml"
            ".github/workflows/reusable-artifact-management.yml"
            ".github/workflows/reusable-argo-rollouts.yml"
            ".github/workflows/reusable-release.yml"
            ".github/workflows/reusable-gitops-promotion.yml"
            ".github/workflows/reusable-platform-delivery.yml"
            ".github/workflows/reusable-policy-validation.yml"
            ".github/workflows/reusable-supply-chain-security.yml"
            ".github/workflows/contract-tests.yml"

            "examples/github-actions/docker-build.yml"
            "examples/github-actions/aws-eks-delivery.yml"
            "examples/github-actions/container-security.yml"
            "examples/github-actions/kubernetes-canary.yml"
            "examples/github-actions/kubernetes-blue-green.yml"
            "examples/github-actions/kubernetes-delivery.yml"
            "examples/github-actions/helm-release.yml"
            "examples/github-actions/environment-promotion.yml"
            "examples/github-actions/artifact-management.yml"
            "examples/github-actions/argo-rollouts.yml"
            "examples/github-actions/release.yml"
            "examples/github-actions/gitops-promotion.yml"
            "examples/github-actions/platform-delivery.yml"
            "examples/github-actions/policy-validation.yml"
            "examples/github-actions/supply-chain-security.yml"

            "templates/kubernetes/canary-deployment.yml"
            "templates/kubernetes/blue-green-deployment.yml"
            "templates/kubernetes/production-deployment.yml"
            "templates/argo-rollouts/canary-rollout.yml"

            "templates/helm/platform-app/Chart.yaml"
            "templates/helm/platform-app/values.yaml"
            "templates/helm/platform-app/templates/deployment.yaml"
            "templates/helm/platform-app/templates/service.yaml"
            "templates/helm/platform-app/templates/_helpers.tpl"

            "templates/gitops/base/kustomization.yaml"
            "templates/gitops/base/deployment.yaml"
            "templates/gitops/overlays/development/kustomization.yaml"
            "templates/gitops/overlays/staging/kustomization.yaml"
            "templates/gitops/overlays/production/kustomization.yaml"
            "templates/gitops/argocd-application.yaml"
            "tests/fixtures/container/Dockerfile"
            "tests/fixtures/container/healthcheck.sh"
            "tests/fixtures/artifact/payload.txt"
            "templates/gitlab-ci/components/container-build.yml"
            "templates/gitlab-ci/components/container-security.yml"
            "templates/gitlab-ci/components/kubernetes-deploy.yml"
            "templates/gitlab-ci/components/kubernetes-rollback.yml"
            "examples/gitlab-ci/platform-delivery.gitlab-ci.yml"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=${file}::Required file is missing"
              exit 1
            fi

            if [[ ! -s "$file" ]]; then
              echo "::error file=${file}::Required file is empty"
              exit 1
            fi
          done

      - name: Reject tracked empty files
        shell: bash
        run: |
          set -Eeuo pipefail

          EMPTY_FILES="$(
            git ls-files -z |
            while IFS= read -r -d '' file; do
              if [[ -f "$file" && ! -s "$file" ]]; then
                printf '%s\n' "$file"
              fi
            done
          )"

          if [[ -n "$EMPTY_FILES" ]]; then
            echo "::error::Tracked empty files detected:"
            printf '%s\n' "$EMPTY_FILES"
            exit 1
          fi

  action-pinning:
    name: Immutable action references
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Reject mutable action references
        shell: bash
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          import pathlib
          import re

          pattern = re.compile(
              r'^\s*uses:\s*(?!\./)(?!docker://)([^@\s]+)@([^\s#]+)',
              re.MULTILINE,
          )

          failures = []

          for path in pathlib.Path(".github/workflows").glob("*.y*ml"):
              text = path.read_text(encoding="utf-8-sig")

              for match in pattern.finditer(text):
                  action = match.group(1)
                  ref = match.group(2)

                  if not re.fullmatch(r"[0-9a-f]{40}", ref):
                      failures.append(
                          f"{path}: {action}@{ref} is not pinned to a full commit SHA"
                      )

          if failures:
              raise SystemExit("\n".join(failures))
          PY

  actionlint:
    name: GitHub Actions validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Run actionlint
        uses: docker://rhysd/actionlint:latest

  yaml:
    name: YAML validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Validate YAML syntax
        shell: bash
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          import pathlib
          import yaml

          roots = [
              pathlib.Path(".github"),
              pathlib.Path("templates"),
              pathlib.Path("examples"),
          ]

          failures = []

          helm_template_root = pathlib.Path("templates/helm")

          for root in roots:
              if not root.exists():
                  continue

              for path in root.rglob("*"):
                  if path.suffix not in {".yml", ".yaml"}:
                      continue

                  if helm_template_root in path.parents and "templates" in path.parts[path.parts.index("helm") + 2:]:
                      continue

                  try:
                      with path.open("r", encoding="utf-8-sig") as handle:
                          list(yaml.safe_load_all(handle))
                  except Exception as exc:
                      failures.append(f"{path}: {exc}")

          if failures:
              raise SystemExit("\n".join(failures))
          PY

  shellcheck:
    name: Shell script validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Run ShellCheck
        shell: bash
        run: |
          set -Eeuo pipefail

          mapfile -t scripts < <(
            find scripts \
              -type f \
              -name '*.sh' \
              -size +0c \
              -print 2>/dev/null
          )

          if (( ${#scripts[@]} == 0 )); then
            echo "No standalone shell scripts to validate."
            exit 0
          fi

          shellcheck "${scripts[@]}"

  helm:
    name: Helm chart validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4

      - name: Lint Helm charts
        shell: bash
        run: |
          set -Eeuo pipefail

          helm dependency update templates/helm/platform-app
          helm lint templates/helm/platform-app

          helm template \
            platform-app \
            templates/helm/platform-app \
            --namespace production \
            --set-string image.repository=ghcr.io/example/platform-app \
            --set-string image.tag=sha-validation \
            > /tmp/helm-rendered.yaml

          test -s /tmp/helm-rendered.yaml

  kubernetes:
    name: Kubernetes schema validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Validate Kubernetes templates
        shell: bash
        run: |
          set -Eeuo pipefail

          docker run --rm \
            -v "${PWD}:/work" \
            ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict \
            -summary \
            /work/templates/kubernetes/canary-deployment.yml \
            /work/templates/kubernetes/blue-green-deployment.yml \
            /work/templates/kubernetes/production-deployment.yml

  gitops:
    name: GitOps rendering validation
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment:
          - development
          - staging
          - production

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install Kustomize
        shell: bash
        run: |
          set -Eeuo pipefail

          VERSION="5.7.1"

          curl --fail --silent --show-error --location \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${VERSION}/kustomize_v${VERSION}_linux_amd64.tar.gz" \
            --output kustomize.tar.gz

          tar -xzf kustomize.tar.gz kustomize
          sudo install -m 0755 kustomize /usr/local/bin/kustomize

      - name: Render overlay
        shell: bash
        run: |
          set -Eeuo pipefail

          kustomize build \
            "templates/gitops/overlays/${{ matrix.environment }}" \
            > rendered.yaml

          test -s rendered.yaml

      - name: Validate rendered overlay
        shell: bash
        run: |
          set -Eeuo pipefail

          docker run --rm \
            -v "${PWD}:/work" \
            ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict \
            -summary \
            /work/rendered.yaml
  policy:
    name: Kubernetes policy validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Validate compliant fixture
        shell: bash
        run: |
          set -Eeuo pipefail

          docker run --rm \
            -v "${PWD}:/project" \
            -w /project \
            openpolicyagent/conftest:v0.62.0 \
            test \
            --policy policies/kubernetes \
            tests/policy/compliant-deployment.yml

      - name: Verify non-compliant fixture is rejected
        shell: bash
        run: |
          set -Eeuo pipefail

          if docker run --rm \
            -v "${PWD}:/project" \
            -w /project \
            openpolicyagent/conftest:v0.62.0 \
            test \
            --policy policies/kubernetes \
            tests/policy/noncompliant-deployment.yml; then

            echo "::error::Non-compliant Kubernetes fixture unexpectedly passed policy validation"
            exit 1
          fi



