name: Validate Repository

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Validate repository structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -Eeuo pipefail

          required_files=(
            "README.md"
            "ROADMAP.md"
            "CHANGELOG.md"
            "LICENSE"
            ".github/workflows/reusable-docker-build.yml"
            "examples/github-actions/docker-build.yml"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=${file}::Required file is missing"
              exit 1
            fi

            echo "validated: ${file}"
          done

  actionlint:
    name: Validate GitHub Actions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install actionlint
        shell: bash
        run: |
          set -Eeuo pipefail

          VERSION="1.7.7"

          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_x86_64.tar.gz" \
            --output actionlint.tar.gz

          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

      - name: Validate workflows
        run: actionlint -color
