name: Validate Repository

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Validate repository structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -Eeuo pipefail

          required_files=(
            "README.md"
            "ROADMAP.md"
            "CHANGELOG.md"
            "LICENSE"
            ".github/workflows/reusable-docker-build.yml"
            ".github/workflows/reusable-container-security.yml"
            ".github/workflows/reusable-kubernetes-deploy.yml"
            "examples/github-actions/docker-build.yml"
            "examples/github-actions/container-security.yml"
            "examples/github-actions/kubernetes-delivery.yml"
            "templates/kubernetes/production-deployment.yml"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=${file}::Required file is missing"
              exit 1
            fi

            echo "validated: ${file}"
          done

  actionlint:
    name: Validate GitHub Actions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: docker://rhysd/actionlint:latest


